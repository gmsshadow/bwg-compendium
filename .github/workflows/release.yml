name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Stamp version and download URL from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" \
             --arg d "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/bwg-compendium.zip" \
             '.version=$v | .download=$d' module.json > module.tmp && mv module.tmp module.json
      - name: Zip module (module.json at zip root)
        run: zip -r bwg-compendium.zip module.json README.md packs assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" module.json bwg-compendium.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" module.json bwg-compendium.zip \
              --title "$GITHUB_REF_NAME" --generate-notes --latest
          fi
